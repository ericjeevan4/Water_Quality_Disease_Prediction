<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Water Quality Disease Prediction
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        .section-title {
            margin-top: 30px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ddd;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #555;
        }

        .button-container {
            text-align: center;
            margin-top: 35px;
        }

        button {
            padding: 13px 35px;
            font-size: 17px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        @media (max-width: 700px) {

            .grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
            }
        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        Water Quality & Disease Prediction
    </h1>

    <p class="description">
        Enter water-quality and environmental parameters
        to predict the most likely waterborne disease.
    </p>


    <form action="/predict"
          method="POST">


        <!-- ========================================= -->
        <!-- WATER QUALITY FEATURES -->
        <!-- ========================================= -->

        <h2 class="section-title">
            Water Quality Parameters
        </h2>

        <div class="grid">


            <div class="form-group">
                <label>
                    Water Quality Index
                </label>

                <input type="number"
                       name="water_quality_index"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    pH
                </label>

                <input type="number"
                       name="ph"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    Turbidity (NTU)
                </label>

                <input type="number"
                       name="turbidity_ntu"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    Dissolved Oxygen (mg/L)
                </label>

                <input type="number"
                       name="dissolved_oxygen_mg_l"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    BOD (mg/L)
                </label>

                <input type="number"
                       name="bod_mg_l"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    Fecal Coliform (per 100 mL)
                </label>

                <input type="number"
                       name="fecal_coliform_per_100ml"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    Total Coliform (per 100 mL)
                </label>

                <input type="number"
                       name="total_coliform_per_100ml"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    TDS (mg/L)
                </label>

                <input type="number"
                       name="tds_mg_l"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    Nitrate (mg/L)
                </label>

                <input type="number"
                       name="nitrate_mg_l"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    Fluoride (mg/L)
                </label>

                <input type="number"
                       name="fluoride_mg_l"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    Arsenic (µg/L)
                </label>

                <input type="number"
                       name="arsenic_ug_l"
                       step="any"
                       required>
            </div>


        </div>


        <!-- ========================================= -->
        <!-- ENVIRONMENTAL & SANITATION FEATURES -->
        <!-- ========================================= -->

        <h2 class="section-title">
            Environmental & Sanitation Parameters
        </h2>

        <div class="grid">


            <div class="form-group">
                <label>
                    Open Defecation Rate (%)
                </label>

                <input type="number"
                       name="open_defecation_rate"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    Toilet Access
                </label>

                <select name="toilet_access"
                        required>

                    <option value="">
                        Select
                    </option>

                    <option value="0">
                        No
                    </option>

                    <option value="1">
                        Yes
                    </option>

                </select>
            </div>


            <div class="form-group">
                <label>
                    Sewage Treatment (%)
                </label>

                <input type="number"
                       name="sewage_treatment_pct"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    Flooding
                </label>

                <select name="flooding"
                        required>

                    <option value="">
                        Select
                    </option>

                    <option value="0">
                        No
                    </option>

                    <option value="1">
                        Yes
                    </option>

                </select>
            </div>


            <div class="form-group">
                <label>
                    Average Temperature (°C)
                </label>

                <input type="number"
                       name="avg_temperature_c"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    Average Rainfall (mm)
                </label>

                <input type="number"
                       name="avg_rainfall_mm"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    Average Humidity (%)
                </label>

                <input type="number"
                       name="avg_humidity_pct"
                       step="any"
                       required>
            </div>


            <div class="form-group">
                <label>
                    Month
                </label>

                <input type="number"
                       name="month"
                       min="1"
                       max="12"
                       required>
            </div>


        </div>


        <!-- ========================================= -->
        <!-- CATEGORICAL FEATURES -->
        <!-- ========================================= -->

        <h2 class="section-title">
            Water Source & Practices
        </h2>

        <div class="grid">


            <div class="form-group">

                <label>
                    Water Source
                </label>

                <select name="water_source"
                        required>

                    <option value="">
                        Select
                    </option>

                    <option value="Borewell">
                        Borewell
                    </option>

                    <option value="Canal">
                        Canal
                    </option>

                    <option value="Pond">
                        Pond
                    </option>

                    <option value="Rainwater">
                        Rainwater
                    </option>

                    <option value="River">
                        River
                    </option>

                    <option value="Tap">
                        Tap
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Water Treatment
                </label>

                <select name="water_treatment"
                        required>

                    <option value="">
                        Select
                    </option>

                    <option value="Boiling">
                        Boiling
                    </option>

                    <option value="Chlorination">
                        Chlorination
                    </option>

                    <option value="Filtration">
                        Filtration
                    </option>

                    <option value="Untreated">
                        Untreated
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Handwashing Practice
                </label>

                <select name="handwashing_practice"
                        required>

                    <option value="">
                        Select
                    </option>

                    <option value="Always">
                        Always
                    </option>

                    <option value="Never">
                        Never
                    </option>

                    <option value="Sometimes">
                        Sometimes
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Season
                </label>

                <select name="season"
                        required>

                    <option value="">
                        Select
                    </option>

                    <option value="Autumn">
                        Autumn
                    </option>

                    <option value="Monsoon">
                        Monsoon
                    </option>

                    <option value="Post-Monsoon">
                        Post-Monsoon
                    </option>

                    <option value="Summer">
                        Summer
                    </option>

                </select>

            </div>


        </div>


        <!-- ========================================= -->
        <!-- SUBMIT -->
        <!-- ========================================= -->

        <div class="button-container">

            <button type="submit">
                Predict Disease
            </button>

        </div>


    </form>

</div>

</body>

</html>
